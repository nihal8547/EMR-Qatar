# Dedicated project name, database, volume and network: nothing here is shared with n8n or any other stack.
name: qatar-hms
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hms
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hms_pass}
      POSTGRES_DB: qatar_hms
    volumes:
      - hms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hms -d qatar_hms"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://hms:${DB_PASSWORD:-hms_pass}@db:5432/qatar_hms
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (copy .env.example)}
      DEMO_DATA: ${DEMO_DATA:-true}
    ports:
      - "${APP_PORT:-4000}:4000"

volumes:
  hms_pgdata:
